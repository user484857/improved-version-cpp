<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cockpit A — Andon Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/dashboards/shared.css">
    <link rel="stylesheet" href="/dashboards/cockpit-a/style.css">
</head>
<body>
    <div class="andon">

        <!-- ═══════ HEADER ═══════ -->
        <header class="andon-header glass">
            <div class="header-left">
                <div class="health-indicator" id="health-indicator">
                    <div class="health-dot" id="health-dot"></div>
                </div>
                <div class="header-titles">
                    <h1 class="header-title" id="header-title">LINE IDLE</h1>
                    <span class="header-sub" id="header-sub">Fischertechnik Battery Cell Testing</span>
                </div>
            </div>
            <div class="header-right">
                <nav class="dash-nav">
                    <a href="/twin-a">Twin</a>
                    <a href="/quality-a">Quality</a>
                    <a href="/kpi-a">KPI</a>
                    <a href="/cockpit-a" class="active">Cockpit</a>
                </nav>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- ═══════ PROCESS FLOW — 7 circles ═══════ -->
        <section class="process-flow" id="process-flow">

            <!-- 1. HBW -->
            <div class="step" id="step-HBW" data-station="HBW">
                <div class="step-ring-wrap">
                    <svg class="traffic-svg" viewBox="0 0 140 140">
                        <circle class="ring-bg" cx="70" cy="70" r="63"/>
                        <circle class="ring-fill" id="ring-HBW" cx="70" cy="70" r="63"/>
                    </svg>
                    <div class="step-circle" id="circle-HBW">
                        <div class="wp-dot" id="wp-HBW"></div>
                    </div>
                </div>
                <div class="step-meta">
                    <span class="step-name">HBW</span>
                    <span class="step-desc" id="desc-HBW">Rack Storage</span>
                </div>
                <div class="rack-grid" id="rack-grid">
                    <div class="rack-dot" data-slot="0"></div>
                    <div class="rack-dot" data-slot="1"></div>
                    <div class="rack-dot" data-slot="2"></div>
                    <div class="rack-dot" data-slot="3"></div>
                    <div class="rack-dot" data-slot="4"></div>
                    <div class="rack-dot" data-slot="5"></div>
                    <div class="rack-dot" data-slot="6"></div>
                    <div class="rack-dot" data-slot="7"></div>
                    <div class="rack-dot" data-slot="8"></div>
                </div>
            </div>

            <div class="flow-connector"><div class="connector-line"></div><div class="connector-arrow"></div></div>

            <!-- 2. Crane (to oven) -->
            <div class="step" id="step-Crane1" data-station="Crane">
                <div class="step-ring-wrap">
                    <svg class="traffic-svg" viewBox="0 0 140 140">
                        <circle class="ring-bg" cx="70" cy="70" r="63"/>
                        <circle class="ring-fill" id="ring-Crane1" cx="70" cy="70" r="63"/>
                    </svg>
                    <div class="step-circle" id="circle-Crane1">
                        <div class="wp-dot" id="wp-Crane1"></div>
                    </div>
                </div>
                <div class="step-meta">
                    <span class="step-name">Crane</span>
                    <span class="step-desc" id="desc-Crane1">To Oven</span>
                </div>
            </div>

            <div class="flow-connector"><div class="connector-line"></div><div class="connector-arrow"></div></div>

            <!-- 3. Oven -->
            <div class="step" id="step-Oven" data-station="MS">
                <div class="step-ring-wrap oven-wrap" id="oven-wrap">
                    <svg class="traffic-svg" viewBox="0 0 140 140">
                        <circle class="ring-bg" cx="70" cy="70" r="63"/>
                        <circle class="ring-fill" id="ring-Oven" cx="70" cy="70" r="63"/>
                    </svg>
                    <div class="step-circle" id="circle-Oven">
                        <div class="wp-dot" id="wp-Oven"></div>
                        <div class="oven-flames" id="oven-flames">
                            <svg viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                                <path d="M16 4c0 4-3 7-3 11s3 7 3 11"/>
                                <path d="M10 8c0 3-2 5-2 8s2 5 2 8"/>
                                <path d="M22 8c0 3-2 5-2 8s2 5 2 8"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="step-meta">
                    <span class="step-name">Oven</span>
                    <span class="step-desc" id="desc-Oven">Burn</span>
                </div>
            </div>

            <div class="flow-connector"><div class="connector-line"></div><div class="connector-arrow"></div></div>

            <!-- 4. Color Measurement -->
            <div class="step" id="step-Color" data-station="SL">
                <div class="step-ring-wrap">
                    <svg class="traffic-svg" viewBox="0 0 140 140">
                        <circle class="ring-bg" cx="70" cy="70" r="63"/>
                        <circle class="ring-fill" id="ring-Color" cx="70" cy="70" r="63"/>
                    </svg>
                    <div class="step-circle" id="circle-Color">
                        <div class="wp-dot color-reveal" id="wp-Color"></div>
                    </div>
                </div>
                <div class="step-meta">
                    <span class="step-name">Color</span>
                    <span class="step-desc" id="desc-Color">Measurement</span>
                </div>
            </div>

            <div class="flow-connector"><div class="connector-line"></div><div class="connector-arrow"></div></div>

            <!-- 5. Sorting -->
            <div class="step" id="step-Sort" data-station="SL">
                <div class="step-ring-wrap">
                    <svg class="traffic-svg" viewBox="0 0 140 140">
                        <circle class="ring-bg" cx="70" cy="70" r="63"/>
                        <circle class="ring-fill" id="ring-Sort" cx="70" cy="70" r="63"/>
                    </svg>
                    <div class="step-circle" id="circle-Sort">
                        <div class="wp-dot" id="wp-Sort"></div>
                    </div>
                </div>
                <div class="step-meta">
                    <span class="step-name">Sort</span>
                    <span class="step-desc" id="desc-Sort">By Color</span>
                </div>
                <div class="sort-bins" id="sort-bins">
                    <div class="bin-col" id="bin-W">
                        <div class="bin-slot"></div><div class="bin-slot"></div><div class="bin-slot"></div>
                        <span class="bin-lbl">W</span>
                    </div>
                    <div class="bin-col" id="bin-R">
                        <div class="bin-slot"></div><div class="bin-slot"></div><div class="bin-slot"></div>
                        <span class="bin-lbl">R</span>
                    </div>
                    <div class="bin-col" id="bin-B">
                        <div class="bin-slot"></div><div class="bin-slot"></div><div class="bin-slot"></div>
                        <span class="bin-lbl">B</span>
                    </div>
                </div>
            </div>

            <div class="flow-connector"><div class="connector-line"></div><div class="connector-arrow"></div></div>

            <!-- 6. Crane (return) -->
            <div class="step" id="step-Crane2" data-station="Crane">
                <div class="step-ring-wrap">
                    <svg class="traffic-svg" viewBox="0 0 140 140">
                        <circle class="ring-bg" cx="70" cy="70" r="63"/>
                        <circle class="ring-fill" id="ring-Crane2" cx="70" cy="70" r="63"/>
                    </svg>
                    <div class="step-circle" id="circle-Crane2">
                        <div class="wp-dot" id="wp-Crane2"></div>
                    </div>
                </div>
                <div class="step-meta">
                    <span class="step-name">Crane</span>
                    <span class="step-desc" id="desc-Crane2">To Rack</span>
                </div>
            </div>

            <div class="flow-connector"><div class="connector-line"></div><div class="connector-arrow"></div></div>

            <!-- 7. Rack (return) -->
            <div class="step" id="step-Rack" data-station="HBW">
                <div class="step-ring-wrap">
                    <svg class="traffic-svg" viewBox="0 0 140 140">
                        <circle class="ring-bg" cx="70" cy="70" r="63"/>
                        <circle class="ring-fill" id="ring-Rack" cx="70" cy="70" r="63"/>
                    </svg>
                    <div class="step-circle" id="circle-Rack">
                        <div class="wp-dot" id="wp-Rack"></div>
                        <svg class="rack-return-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                        </svg>
                    </div>
                </div>
                <div class="step-meta">
                    <span class="step-name">Rack</span>
                    <span class="step-desc" id="desc-Rack">Store</span>
                </div>
            </div>

        </section>

        <!-- ═══════ INFO BAR ═══════ -->
        <section class="info-bar">

            <!-- Production Today -->
            <div class="info-card glass" id="card-production">
                <div class="info-card-head">
                    <span class="info-label">Produced Today</span>
                    <span class="production-count mono" id="prod-count">0 / 9</span>
                </div>
                <div class="prod-track">
                    <div class="prod-fill" id="prod-fill"></div>
                </div>
                <div class="prod-pips" id="prod-pips"></div>
            </div>

            <!-- Cycle Time -->
            <div class="info-card glass" id="card-cycle">
                <span class="info-label">Cycle Time</span>
                <div class="cycle-row">
                    <span class="cycle-big mono" id="cycle-last">--</span>
                    <span class="cycle-unit">s</span>
                </div>
                <span class="cycle-avg mono" id="cycle-avg">avg --</span>
            </div>

            <!-- Alert Toggle -->
            <button class="alert-pill glass" id="alert-pill" onclick="toggleAlerts()">
                <div class="alert-indicator" id="alert-indicator"></div>
                <span class="alert-label" id="alert-label">Loading</span>
                <svg class="alert-chevron" id="alert-chevron" viewBox="0 0 12 12" width="12" height="12"><polyline points="3,4.5 6,7.5 9,4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>

        </section>

        <!-- Alert Drawer -->
        <div class="alert-drawer" id="alert-drawer">
            <div class="alert-list" id="alert-list"></div>
        </div>

        <!-- ═══════ FOOTER ═══════ -->
        <footer class="andon-footer">
            <span class="footer-item mono" id="footer-time">--:--:--</span>
            <span class="footer-dot"></span>
            <span class="footer-item" id="footer-mode">Demo</span>
            <span class="footer-dot"></span>
            <span class="footer-item mono" id="footer-updated">--</span>
            <span class="footer-dot"></span>
            <span class="footer-item mono" id="footer-db" title="SQLite database">DB: --</span>
        </footer>

    </div>

    <script src="/dashboards/cockpit-a/app.js"></script>
</body>
</html>
