<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin A</title>
    <link rel="stylesheet" href="/dashboards/shared.css">
    <link rel="stylesheet" href="/dashboards/twin-a/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>(function(){var t=localStorage.getItem("theme")||"dark";document.documentElement.setAttribute("data-theme",t)})();</script>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="twin-header glass">
            <div class="twin-header-left">
                <svg class="twin-logo" width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <rect width="24" height="24" rx="6" fill="url(#logo-g)"/>
                    <circle cx="12" cy="12" r="4" fill="none" stroke="white" stroke-width="1.5"/>
                    <circle cx="12" cy="12" r="1.5" fill="white"/>
                    <path d="M12 4v2M12 18v2M4 12h2M18 12h2" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
                    <defs><linearGradient id="logo-g" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#007AFF"/><stop offset="1" stop-color="#5856D6"/></linearGradient></defs>
                </svg>
                <span class="twin-title">Digital Twin</span>
                <nav class="dash-nav">
                    <a href="/twin-a" class="active">Twin</a>
                    <a href="/quality-a">Quality</a>
                    <a href="/kpi-a">KPI</a>
                    <a href="/cockpit-a">Cockpit</a>
                </nav>
            </div>
            <div class="twin-header-right">
                <div class="live-pill" id="live-pill">
                    <span class="live-dot"></span>
                    <span class="live-text">Live</span>
                    <span class="live-sep">&middot;</span>
                    <span class="live-latency mono" id="live-latency">--</span>
                </div>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
                    <svg class="icon-moon" width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
                    <svg class="icon-sun" width="16" height="16" viewBox="0 0 20 20" fill="currentColor" style="display:none"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/></svg>
                </button>
            </div>
        </header>

        <!-- Factory Floor SVG -->
        <div class="factory-card glass" id="factory-card">
            <svg id="factory-svg" viewBox="0 0 960 440" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <!-- Subtle grid -->
                    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.3" stroke-opacity="0.05"/>
                    </pattern>

                    <!-- Station glow filters -->
                    <filter id="glow-hbw" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="6" result="b"/><feFlood flood-color="#AF52DE" flood-opacity="0.4" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-crane" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="6" result="b"/><feFlood flood-color="#30D158" flood-opacity="0.4" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-oven" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="6" result="b"/><feFlood flood-color="#007AFF" flood-opacity="0.4" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-out" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="6" result="b"/><feFlood flood-color="#007AFF" flood-opacity="0.35" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-color" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="6" result="b"/><feFlood flood-color="#5AC8FA" flood-opacity="0.4" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-sort" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="6" result="b"/><feFlood flood-color="#FF9F0A" flood-opacity="0.4" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-return" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="6" result="b"/><feFlood flood-color="#30D158" flood-opacity="0.35" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-rack" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="6" result="b"/><feFlood flood-color="#AF52DE" flood-opacity="0.35" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>

                    <!-- Oven burn glow -->
                    <filter id="oven-burn" x="-80%" y="-80%" width="260%" height="260%">
                        <feGaussianBlur stdDeviation="10" result="b"/><feFlood flood-color="#FF453A" flood-opacity="0.5" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>

                    <!-- Workpiece glow -->
                    <filter id="glow-wp" x="-100%" y="-100%" width="300%" height="300%">
                        <feGaussianBlur stdDeviation="4" result="b"/>
                        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>

                    <!-- Flow marker for dashed paths -->
                    <marker id="flow-dot" viewBox="0 0 4 4" refX="2" refY="2" markerWidth="3" markerHeight="3">
                        <circle cx="2" cy="2" r="1.2" fill="var(--text-tertiary)" opacity="0.25"/>
                    </marker>
                </defs>

                <!-- Grid bg -->
                <rect width="960" height="440" fill="url(#grid)" opacity="0.5"/>

                <!-- ===== Connection paths ===== -->
                <g class="connections">
                    <!-- HBW -> Crane -->
                    <path id="conn-1" class="conn-path" d="M 155 210 C 210 210, 290 210, 350 210"/>
                    <!-- Crane -> Oven -->
                    <path id="conn-2" class="conn-path" d="M 448 175 C 460 130, 475 95, 500 80"/>
                    <!-- Oven -> Out -->
                    <path id="conn-3" class="conn-path" d="M 588 80 C 610 80, 630 80, 648 80"/>
                    <!-- Out -> Color -->
                    <path id="conn-4" class="conn-path" d="M 736 95 C 755 140, 765 175, 770 200"/>
                    <!-- Color -> Sort -->
                    <path id="conn-5" class="conn-path" d="M 770 270 C 768 305, 750 340, 730 355"/>
                    <!-- Sort -> Crane Return -->
                    <path id="conn-6" class="conn-path" d="M 648 365 C 570 365, 490 340, 448 275"/>
                    <!-- Crane Return -> Rack -->
                    <path id="conn-7" class="conn-path" d="M 350 250 C 290 260, 210 268, 155 272"/>
                </g>

                <!-- Step numbers along paths -->
                <g class="step-badges">
                    <g class="step-badge"><circle cx="90"  cy="210" r="9"/><text x="90"  y="214">1</text></g>
                    <g class="step-badge"><circle cx="400" cy="175" r="9"/><text x="400" y="179">2</text></g>
                    <g class="step-badge"><circle cx="544" cy="55"  r="9"/><text x="544" y="59">3</text></g>
                    <g class="step-badge"><circle cx="692" cy="55"  r="9"/><text x="692" y="59">4</text></g>
                    <g class="step-badge"><circle cx="800" cy="235" r="9"/><text x="800" y="239">5</text></g>
                    <g class="step-badge"><circle cx="730" cy="390" r="9"/><text x="730" y="394">6</text></g>
                    <g class="step-badge"><circle cx="400" cy="275" r="9"/><text x="400" y="279">7</text></g>
                    <g class="step-badge"><circle cx="115" cy="290" r="9"/><text x="115" y="294">8</text></g>
                </g>

                <!-- ===== STATIONS ===== -->

                <!-- 1. HBW (High-Bay Warehouse) -->
                <g class="stn" id="stn-hbw" data-step="hbw">
                    <rect x="65" y="175" width="90" height="72" rx="14" class="stn-bg" data-color="#AF52DE"/>
                    <text x="110" y="200" text-anchor="middle" class="stn-label">HBW</text>
                    <text x="110" y="214" text-anchor="middle" class="stn-sub">Retrieve</text>
                    <text x="110" y="237" text-anchor="middle" class="stn-action" id="action-hbw">--</text>
                </g>

                <!-- 2. Crane (transport to oven) -->
                <g class="stn" id="stn-crane" data-step="crane">
                    <rect x="355" y="170" width="90" height="72" rx="14" class="stn-bg" data-color="#30D158"/>
                    <text x="400" y="195" text-anchor="middle" class="stn-label">Crane</text>
                    <text x="400" y="209" text-anchor="middle" class="stn-sub">Transport</text>
                    <text x="400" y="232" text-anchor="middle" class="stn-action" id="action-crane">--</text>
                </g>

                <!-- 3. Oven (MS) -->
                <g class="stn" id="stn-oven" data-step="oven">
                    <rect x="500" y="45" width="90" height="72" rx="14" class="stn-bg stn-oven-box" data-color="#007AFF"/>
                    <rect id="oven-glow-rect" x="506" y="51" width="78" height="60" rx="11" class="oven-inner"/>
                    <text x="545" y="72" text-anchor="middle" class="stn-label">Oven</text>
                    <text x="545" y="86" text-anchor="middle" class="stn-sub">Burn</text>
                    <text x="545" y="107" text-anchor="middle" class="stn-action" id="action-oven">--</text>
                </g>

                <!-- 4. Out (MS ejector) -->
                <g class="stn" id="stn-out" data-step="out">
                    <rect x="648" y="45" width="90" height="72" rx="14" class="stn-bg" data-color="#007AFF"/>
                    <text x="693" y="72" text-anchor="middle" class="stn-label">Out</text>
                    <text x="693" y="86" text-anchor="middle" class="stn-sub">Eject</text>
                    <text x="693" y="107" text-anchor="middle" class="stn-action" id="action-out">--</text>
                </g>

                <!-- 5. Color (SL sensor) -->
                <g class="stn" id="stn-color" data-step="color">
                    <rect x="725" y="200" width="90" height="72" rx="14" class="stn-bg" data-color="#5AC8FA"/>
                    <text x="770" y="225" text-anchor="middle" class="stn-label">Color</text>
                    <text x="770" y="239" text-anchor="middle" class="stn-sub">Measure</text>
                    <text x="770" y="262" text-anchor="middle" class="stn-action" id="action-color">--</text>
                </g>

                <!-- 6. Sort (SL valves) -->
                <g class="stn" id="stn-sort" data-step="sort">
                    <rect x="648" y="325" width="90" height="72" rx="14" class="stn-bg" data-color="#FF9F0A"/>
                    <text x="693" y="350" text-anchor="middle" class="stn-label">Sort</text>
                    <text x="693" y="364" text-anchor="middle" class="stn-sub">Classify</text>
                    <text x="693" y="387" text-anchor="middle" class="stn-action" id="action-sort">--</text>
                </g>

                <!-- 7. Crane Return -->
                <g class="stn" id="stn-return" data-step="return">
                    <rect x="355" y="245" width="90" height="52" rx="14" class="stn-bg stn-sm" data-color="#30D158"/>
                    <text x="400" y="268" text-anchor="middle" class="stn-label">Crane</text>
                    <text x="400" y="282" text-anchor="middle" class="stn-sub">Return</text>
                </g>

                <!-- 8. Rack (HBW store) -->
                <g class="stn" id="stn-rack" data-step="rack">
                    <rect x="65" y="255" width="90" height="52" rx="14" class="stn-bg stn-sm" data-color="#AF52DE"/>
                    <text x="110" y="278" text-anchor="middle" class="stn-label">Rack</text>
                    <text x="110" y="292" text-anchor="middle" class="stn-sub">Store</text>
                </g>

                <!-- ===== WORKPIECE DOT ===== -->
                <g id="wp-group" visibility="hidden" filter="url(#glow-wp)">
                    <circle class="wp-halo" r="18" fill="currentColor" opacity="0.04"/>
                    <circle class="wp-ring" r="12" fill="currentColor" opacity="0.08"/>
                    <circle class="wp-body" id="wp-dot" r="7.5" fill="#888" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
                    <circle class="wp-spec" r="2" cx="-1.5" cy="-2" fill="rgba(255,255,255,0.18)"/>
                </g>

            </svg>
        </div>

        <!-- Timing Row -->
        <div class="timing-row" id="timing-row">
            <div class="timing-pill glass" data-step="hbw">
                <div class="pill-head">
                    <span class="pill-dot" id="tl-hbw"></span>
                    <span class="pill-name">HBW</span>
                </div>
                <div class="pill-times">
                    <span class="pill-last mono" id="time-hbw">--</span>
                    <span class="pill-avg mono" id="avg-hbw"></span>
                </div>
            </div>
            <span class="timing-sep"></span>
            <div class="timing-pill glass" data-step="crane">
                <div class="pill-head">
                    <span class="pill-dot" id="tl-crane"></span>
                    <span class="pill-name">Crane</span>
                </div>
                <div class="pill-times">
                    <span class="pill-last mono" id="time-crane">--</span>
                    <span class="pill-avg mono" id="avg-crane"></span>
                </div>
            </div>
            <span class="timing-sep"></span>
            <div class="timing-pill glass" data-step="oven">
                <div class="pill-head">
                    <span class="pill-dot" id="tl-oven"></span>
                    <span class="pill-name">Oven</span>
                </div>
                <div class="pill-times">
                    <span class="pill-last mono" id="time-oven">--</span>
                    <span class="pill-avg mono" id="avg-oven"></span>
                </div>
            </div>
            <span class="timing-sep"></span>
            <div class="timing-pill glass" data-step="color">
                <div class="pill-head">
                    <span class="pill-dot" id="tl-color"></span>
                    <span class="pill-name">Color</span>
                </div>
                <div class="pill-times">
                    <span class="pill-last mono" id="time-color">--</span>
                    <span class="pill-avg mono" id="avg-color"></span>
                </div>
            </div>
            <span class="timing-sep"></span>
            <div class="timing-pill glass" data-step="sort">
                <div class="pill-head">
                    <span class="pill-dot" id="tl-sort"></span>
                    <span class="pill-name">Sort</span>
                </div>
                <div class="pill-times">
                    <span class="pill-last mono" id="time-sort">--</span>
                    <span class="pill-avg mono" id="avg-sort"></span>
                </div>
            </div>
            <span class="timing-sep"></span>
            <div class="timing-pill glass total-pill">
                <div class="pill-head">
                    <span class="pill-name">Total</span>
                </div>
                <div class="pill-times">
                    <span class="pill-last mono" id="time-total">--</span>
                </div>
            </div>
        </div>
        <!-- Event Log (from SQLite history) -->
        <div class="event-log glass" id="event-log-panel">
            <div class="event-log-header">
                <div class="event-log-left">
                    <span class="event-log-title">EVENT LOG</span>
                    <span class="event-log-count mono" id="event-log-count">--</span>
                </div>
                <div class="event-log-right">
                    <select class="event-log-filter mono" id="event-log-filter" onchange="filterEventLog()">
                        <option value="">All Stations</option>
                        <option value="HBW">HBW</option>
                        <option value="Crane">Crane</option>
                        <option value="MS">MS</option>
                        <option value="SL">SL</option>
                    </select>
                </div>
            </div>
            <div class="event-log-body" id="event-log-body">
                <div class="event-log-empty mono">Loading history...</div>
            </div>
        </div>
    </div>

    <script src="/dashboards/twin-a/app.js"></script>
</body>
</html>
