<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin R2A</title>
    <link rel="stylesheet" href="/dashboards/shared.css">
    <link rel="stylesheet" href="/dashboards/twin-r2a/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>(function(){var t=localStorage.getItem("theme")||"dark";document.documentElement.setAttribute("data-theme",t)})();</script>
</head>
<body>
    <div class="app">
        <!-- Minimal Header -->
        <header class="twin-header glass">
            <div class="twin-header-left">
                <svg class="twin-logo" width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <rect width="24" height="24" rx="6" fill="url(#r2alg)"/>
                    <circle cx="12" cy="12" r="4" fill="none" stroke="white" stroke-width="1.5"/>
                    <circle cx="12" cy="12" r="1.5" fill="white"/>
                    <path d="M12 4v2M12 18v2M4 12h2M18 12h2" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
                    <defs><linearGradient id="r2alg" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#007AFF"/><stop offset="1" stop-color="#5856D6"/></linearGradient></defs>
                </svg>
                <span class="twin-title">Digital Twin</span>
            </div>
            <div class="twin-header-right">
                <div class="live-pill" id="live-pill">
                    <span class="live-dot"></span>
                    <span class="live-text">Live</span>
                    <span class="live-sep">&middot;</span>
                    <span class="live-latency mono" id="live-latency">--</span>
                </div>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
                    <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
                </button>
            </div>
        </header>

        <!-- Factory Floor SVG -->
        <div class="factory-floor glass" id="factory-floor">
            <svg id="factory-svg" viewBox="0 0 960 420" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <!-- Subtle grid -->
                    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.3" stroke-opacity="0.06"/>
                    </pattern>

                    <!-- Station glow filters -->
                    <filter id="glow-hbw" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" result="b"/><feFlood flood-color="#AF52DE" flood-opacity="0.35" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-crane" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" result="b"/><feFlood flood-color="#30D158" flood-opacity="0.35" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-oven" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" result="b"/><feFlood flood-color="#007AFF" flood-opacity="0.35" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-out" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" result="b"/><feFlood flood-color="#007AFF" flood-opacity="0.35" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-color" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" result="b"/><feFlood flood-color="#5AC8FA" flood-opacity="0.35" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-sort" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" result="b"/><feFlood flood-color="#FF9F0A" flood-opacity="0.35" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-return" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" result="b"/><feFlood flood-color="#30D158" flood-opacity="0.35" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-rack" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" result="b"/><feFlood flood-color="#AF52DE" flood-opacity="0.35" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>

                    <!-- Oven burn glow -->
                    <filter id="oven-burn-filter" x="-80%" y="-80%" width="260%" height="260%">
                        <feGaussianBlur stdDeviation="10" result="b"/><feFlood flood-color="#FF453A" flood-opacity="0.5" result="c"/>
                        <feComposite in="c" in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>

                    <!-- Workpiece glow -->
                    <filter id="glow-wp" x="-100%" y="-100%" width="300%" height="300%">
                        <feGaussianBlur stdDeviation="4" result="b"/>
                        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                </defs>

                <!-- Grid bg -->
                <rect width="960" height="420" fill="url(#grid)" opacity="0.5"/>

                <!-- ===== Connection paths ===== -->
                <g class="connections">
                    <!-- HBW -> Crane -->
                    <path id="conn-1" class="conn-path" d="M 148 210 C 200 210, 280 210, 340 210"/>
                    <!-- Crane -> Oven -->
                    <path id="conn-2" class="conn-path" d="M 438 180 C 445 140, 450 100, 480 85"/>
                    <!-- Oven -> Out -->
                    <path id="conn-3" class="conn-path" d="M 570 85 C 590 85, 610 85, 630 85"/>
                    <!-- Out -> Color -->
                    <path id="conn-4" class="conn-path" d="M 720 100 C 740 140, 750 180, 750 210"/>
                    <!-- Color -> Sort -->
                    <path id="conn-5" class="conn-path" d="M 750 270 C 750 300, 740 330, 720 340"/>
                    <!-- Sort -> Crane Return -->
                    <path id="conn-6" class="conn-path" d="M 630 345 C 560 345, 480 320, 438 260"/>
                    <!-- Crane Return -> Rack -->
                    <path id="conn-7" class="conn-path" d="M 340 230 C 280 240, 200 250, 148 260"/>
                </g>

                <!-- Step numbers along path -->
                <g class="step-numbers">
                    <circle cx="90" cy="210" r="9" class="step-num-bg"/><text x="90" y="214" class="step-num">1</text>
                    <circle cx="390" cy="185" r="9" class="step-num-bg"/><text x="390" y="189" class="step-num">2</text>
                    <circle cx="525" cy="62" r="9" class="step-num-bg"/><text x="525" y="66" class="step-num">3</text>
                    <circle cx="675" cy="62" r="9" class="step-num-bg"/><text x="675" y="66" class="step-num">4</text>
                    <circle cx="780" cy="210" r="9" class="step-num-bg"/><text x="780" y="214" class="step-num">5</text>
                    <circle cx="710" cy="370" r="9" class="step-num-bg"/><text x="710" y="374" class="step-num">6</text>
                    <circle cx="390" cy="265" r="9" class="step-num-bg"/><text x="390" y="269" class="step-num">7</text>
                    <circle cx="120" cy="275" r="9" class="step-num-bg"/><text x="120" y="279" class="step-num">8</text>
                </g>

                <!-- ===== STATIONS ===== -->

                <!-- 1. HBW -->
                <g class="stn" id="stn-hbw" data-step="hbw">
                    <rect x="60" y="175" width="88" height="70" rx="12" class="stn-box" data-color="#AF52DE"/>
                    <text x="104" y="200" text-anchor="middle" class="stn-label">HBW</text>
                    <text x="104" y="214" text-anchor="middle" class="stn-sub">Retrieve</text>
                    <text x="104" y="235" text-anchor="middle" class="stn-action" id="action-hbw">--</text>
                </g>

                <!-- 2. Crane (to oven) -->
                <g class="stn" id="stn-crane" data-step="crane">
                    <rect x="346" y="170" width="88" height="70" rx="12" class="stn-box" data-color="#30D158"/>
                    <text x="390" y="195" text-anchor="middle" class="stn-label">Crane</text>
                    <text x="390" y="209" text-anchor="middle" class="stn-sub">Transport</text>
                    <text x="390" y="230" text-anchor="middle" class="stn-action" id="action-crane">--</text>
                </g>

                <!-- 3. Oven (MS) -->
                <g class="stn" id="stn-oven" data-step="oven">
                    <rect x="480" y="50" width="88" height="70" rx="12" class="stn-box stn-oven" data-color="#007AFF"/>
                    <rect id="oven-glow-rect" x="486" y="56" width="76" height="58" rx="9" class="oven-inner"/>
                    <text x="524" y="77" text-anchor="middle" class="stn-label">Oven</text>
                    <text x="524" y="91" text-anchor="middle" class="stn-sub">Burn</text>
                    <text x="524" y="110" text-anchor="middle" class="stn-action" id="action-oven">--</text>
                </g>

                <!-- 4. Out (MS ejector) -->
                <g class="stn" id="stn-out" data-step="out">
                    <rect x="630" y="50" width="88" height="70" rx="12" class="stn-box" data-color="#007AFF"/>
                    <text x="674" y="77" text-anchor="middle" class="stn-label">Out</text>
                    <text x="674" y="91" text-anchor="middle" class="stn-sub">Eject</text>
                    <text x="674" y="110" text-anchor="middle" class="stn-action" id="action-out">--</text>
                </g>

                <!-- 5. Color Measurement (SL) -->
                <g class="stn" id="stn-color" data-step="color">
                    <rect x="716" y="175" width="88" height="70" rx="12" class="stn-box" data-color="#5AC8FA"/>
                    <text x="760" y="200" text-anchor="middle" class="stn-label">Color</text>
                    <text x="760" y="214" text-anchor="middle" class="stn-sub">Measure</text>
                    <text x="760" y="235" text-anchor="middle" class="stn-action" id="action-color">--</text>
                </g>

                <!-- 6. Sorting (SL) -->
                <g class="stn" id="stn-sort" data-step="sort">
                    <rect x="630" y="310" width="88" height="70" rx="12" class="stn-box" data-color="#FF9F0A"/>
                    <text x="674" y="335" text-anchor="middle" class="stn-label">Sort</text>
                    <text x="674" y="349" text-anchor="middle" class="stn-sub">Classify</text>
                    <text x="674" y="370" text-anchor="middle" class="stn-action" id="action-sort">--</text>
                </g>

                <!-- 7. Crane Return -->
                <g class="stn" id="stn-return" data-step="return">
                    <rect x="346" y="290" width="88" height="50" rx="12" class="stn-box stn-small" data-color="#30D158"/>
                    <text x="390" y="313" text-anchor="middle" class="stn-label">Crane</text>
                    <text x="390" y="327" text-anchor="middle" class="stn-sub">Return</text>
                </g>

                <!-- 8. Rack (HBW store) -->
                <g class="stn" id="stn-rack" data-step="rack">
                    <rect x="60" y="255" width="88" height="50" rx="12" class="stn-box stn-small" data-color="#AF52DE"/>
                    <text x="104" y="278" text-anchor="middle" class="stn-label">Rack</text>
                    <text x="104" y="292" text-anchor="middle" class="stn-sub">Store</text>
                </g>

                <!-- ===== WORKPIECE DOT ===== -->
                <g id="wp-group" visibility="hidden" filter="url(#glow-wp)">
                    <circle class="wp-halo" r="16" fill="currentColor" opacity="0.06"/>
                    <circle class="wp-ring" r="11" fill="currentColor" opacity="0.1"/>
                    <circle class="wp-body" id="wp-dot" r="7" fill="#666" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
                    <circle class="wp-spec" r="2.5" cx="-1.5" cy="-2" fill="rgba(255,255,255,0.2)"/>
                </g>

            </svg>
        </div>

        <!-- Timing Row -->
        <div class="timing-row" id="timing-row">
            <div class="timing-pill glass" data-step="hbw">
                <div class="pill-top">
                    <span class="pill-dot" id="tl-hbw"></span>
                    <span class="pill-name">HBW</span>
                </div>
                <span class="pill-time mono" id="time-hbw">--</span>
            </div>
            <span class="timing-arrow">&rsaquo;</span>
            <div class="timing-pill glass" data-step="crane">
                <div class="pill-top">
                    <span class="pill-dot" id="tl-crane"></span>
                    <span class="pill-name">Crane</span>
                </div>
                <span class="pill-time mono" id="time-crane">--</span>
            </div>
            <span class="timing-arrow">&rsaquo;</span>
            <div class="timing-pill glass" data-step="oven">
                <div class="pill-top">
                    <span class="pill-dot" id="tl-oven"></span>
                    <span class="pill-name">Oven</span>
                </div>
                <span class="pill-time mono" id="time-oven">--</span>
            </div>
            <span class="timing-arrow">&rsaquo;</span>
            <div class="timing-pill glass" data-step="color">
                <div class="pill-top">
                    <span class="pill-dot" id="tl-color"></span>
                    <span class="pill-name">Color</span>
                </div>
                <span class="pill-time mono" id="time-color">--</span>
            </div>
            <span class="timing-arrow">&rsaquo;</span>
            <div class="timing-pill glass" data-step="sort">
                <div class="pill-top">
                    <span class="pill-dot" id="tl-sort"></span>
                    <span class="pill-name">Sort</span>
                </div>
                <span class="pill-time mono" id="time-sort">--</span>
            </div>
            <span class="timing-arrow">&rsaquo;</span>
            <div class="timing-pill glass total-pill">
                <div class="pill-top">
                    <span class="pill-name">Total</span>
                </div>
                <span class="pill-time mono" id="time-total">--</span>
            </div>
        </div>
    </div>

    <script src="/dashboards/twin-r2a/app.js"></script>
</body>
</html>
