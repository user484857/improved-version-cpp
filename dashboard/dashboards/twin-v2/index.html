<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin V2 - Clean Technical Glass</title>
    <link rel="stylesheet" href="/dashboards/shared.css">
    <link rel="stylesheet" href="/dashboards/twin-v2/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>(function(){var t=localStorage.getItem("theme")||"dark";document.documentElement.setAttribute("data-theme",t)})();</script>
</head>
<body>
    <div class="app">
        <!-- Minimal Header -->
        <header class="twin-header glass">
            <div class="twin-header-left">
                <svg class="twin-logo" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect width="24" height="24" rx="6" fill="url(#v2lg)"/>
                    <path d="M6 12h3l2-4 3 8 2-4h3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs><linearGradient id="v2lg" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#007AFF"/><stop offset="1" stop-color="#5856D6"/></linearGradient></defs>
                </svg>
                <span class="twin-title">Digital Twin</span>
            </div>
            <div class="twin-header-right">
                <div class="live-pill" id="live-pill">
                    <span class="live-dot"></span>
                    <span class="live-text">Live</span>
                    <span class="live-latency mono" id="live-latency">--</span>
                </div>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
                    <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
                </button>
            </div>
        </header>

        <!-- Factory Floor SVG -->
        <div class="factory-floor glass" id="factory-floor">
            <svg id="factory-svg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <!-- Station glow filters -->
                    <filter id="glow-active" x="-40%" y="-40%" width="180%" height="180%">
                        <feGaussianBlur stdDeviation="8" result="blur"/>
                        <feFlood flood-opacity="0.25" result="color"/>
                        <feComposite in="color" in2="blur" operator="in" result="glow"/>
                        <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-hbw" x="-40%" y="-40%" width="180%" height="180%">
                        <feGaussianBlur stdDeviation="6" result="blur"/>
                        <feFlood flood-color="#AF52DE" flood-opacity="0.3" result="color"/>
                        <feComposite in="color" in2="blur" operator="in" result="glow"/>
                        <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-crane" x="-40%" y="-40%" width="180%" height="180%">
                        <feGaussianBlur stdDeviation="6" result="blur"/>
                        <feFlood flood-color="#30D158" flood-opacity="0.3" result="color"/>
                        <feComposite in="color" in2="blur" operator="in" result="glow"/>
                        <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-ms" x="-40%" y="-40%" width="180%" height="180%">
                        <feGaussianBlur stdDeviation="6" result="blur"/>
                        <feFlood flood-color="#007AFF" flood-opacity="0.3" result="color"/>
                        <feComposite in="color" in2="blur" operator="in" result="glow"/>
                        <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-pm" x="-40%" y="-40%" width="180%" height="180%">
                        <feGaussianBlur stdDeviation="6" result="blur"/>
                        <feFlood flood-color="#FF453A" flood-opacity="0.3" result="color"/>
                        <feComposite in="color" in2="blur" operator="in" result="glow"/>
                        <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-sl" x="-40%" y="-40%" width="180%" height="180%">
                        <feGaussianBlur stdDeviation="6" result="blur"/>
                        <feFlood flood-color="#FF9F0A" flood-opacity="0.3" result="color"/>
                        <feComposite in="color" in2="blur" operator="in" result="glow"/>
                        <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-wp" x="-100%" y="-100%" width="300%" height="300%">
                        <feGaussianBlur stdDeviation="3" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>

                    <!-- Grid pattern for floor -->
                    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.3" stroke-opacity="0.08"/>
                    </pattern>
                </defs>

                <!-- Subtle grid background -->
                <rect width="1000" height="500" fill="url(#grid)" opacity="0.6"/>

                <!-- ===== Connection paths ===== -->
                <g class="connections" id="connections">
                    <path id="conn-hbw-crane" class="conn-path" d="M 205 275 C 250 275, 300 268, 360 265"/>
                    <path id="conn-crane-ms" class="conn-path" d="M 480 230 C 510 180, 530 130, 560 110"/>
                    <path id="conn-ms-pm" class="conn-path" d="M 710 100 C 740 100, 770 105, 790 115"/>
                    <path id="conn-crane-sl" class="conn-path" d="M 480 300 C 510 340, 530 370, 560 385"/>
                    <path id="conn-sl-hbw" class="conn-path" d="M 560 430 C 400 460, 250 420, 145 330"/>
                </g>

                <!-- ===== HBW (High Bay Warehouse) — left ===== -->
                <g class="station" id="station-hbw" data-station="HBW">
                    <rect x="30" y="170" width="180" height="210" rx="10" class="station-rect" data-color="#AF52DE"/>
                    <!-- 3x3 rack -->
                    <g transform="translate(50, 200)">
                        <rect width="90" height="90" rx="4" fill="none" stroke="#AF52DE" stroke-width="0.8" opacity="0.3"/>
                        <line x1="30" y1="0" x2="30" y2="90" stroke="#AF52DE" stroke-width="0.4" opacity="0.2"/>
                        <line x1="60" y1="0" x2="60" y2="90" stroke="#AF52DE" stroke-width="0.4" opacity="0.2"/>
                        <line x1="0" y1="30" x2="90" y2="30" stroke="#AF52DE" stroke-width="0.4" opacity="0.2"/>
                        <line x1="0" y1="60" x2="90" y2="60" stroke="#AF52DE" stroke-width="0.4" opacity="0.2"/>
                        <rect id="rack-0-0" x="3" y="3" width="24" height="24" rx="3" class="rack-slot filled"/>
                        <rect id="rack-1-0" x="33" y="3" width="24" height="24" rx="3" class="rack-slot filled"/>
                        <rect id="rack-2-0" x="63" y="3" width="24" height="24" rx="3" class="rack-slot empty"/>
                        <rect id="rack-0-1" x="3" y="33" width="24" height="24" rx="3" class="rack-slot filled"/>
                        <rect id="rack-1-1" x="33" y="33" width="24" height="24" rx="3" class="rack-slot empty"/>
                        <rect id="rack-2-1" x="63" y="33" width="24" height="24" rx="3" class="rack-slot empty"/>
                        <rect id="rack-0-2" x="3" y="63" width="24" height="24" rx="3" class="rack-slot filled"/>
                        <rect id="rack-1-2" x="33" y="63" width="24" height="24" rx="3" class="rack-slot empty"/>
                        <rect id="rack-2-2" x="63" y="63" width="24" height="24" rx="3" class="rack-slot empty"/>
                    </g>
                    <!-- Conveyor -->
                    <rect x="150" y="330" width="50" height="10" rx="3" fill="rgba(175,82,222,0.1)" stroke="#AF52DE" stroke-width="0.6" opacity="0.4"/>
                    <line x1="155" y1="335" x2="195" y2="335" stroke="#AF52DE" stroke-width="0.5" opacity="0.2" stroke-dasharray="3,2"/>
                    <!-- Label -->
                    <text x="120" y="192" text-anchor="middle" class="station-name" fill="#AF52DE">HBW</text>
                    <text x="120" y="204" text-anchor="middle" class="station-sub">High Bay Warehouse</text>
                    <!-- Status dot -->
                    <circle id="dot-hbw" cx="44" cy="185" r="4" class="status-indicator"/>
                </g>

                <!-- ===== Crane (Vacuum Gripper) — center ===== -->
                <g class="station" id="station-crane" data-station="Crane">
                    <rect x="330" y="190" width="180" height="170" rx="10" class="station-rect" data-color="#30D158"/>
                    <!-- Circular platform -->
                    <circle cx="420" cy="275" r="45" fill="none" stroke="#30D158" stroke-width="1" opacity="0.25"/>
                    <circle cx="420" cy="275" r="30" fill="rgba(48,209,88,0.04)" stroke="#30D158" stroke-width="0.6" opacity="0.2"/>
                    <circle cx="420" cy="275" r="4" fill="#30D158" fill-opacity="0.4"/>
                    <!-- Rotating arm -->
                    <line id="crane-arm" x1="420" y1="275" x2="420" y2="232" stroke="#30D158" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
                    <circle id="crane-gripper" cx="420" cy="232" r="5" fill="none" stroke="#30D158" stroke-width="1.5" opacity="0.4"/>
                    <!-- Label -->
                    <text x="420" y="210" text-anchor="middle" class="station-name" fill="#30D158">Crane</text>
                    <text x="420" y="222" text-anchor="middle" class="station-sub">Vacuum Gripper</text>
                    <!-- Status dot -->
                    <circle id="dot-crane" cx="344" cy="206" r="4" class="status-indicator"/>
                </g>

                <!-- ===== MS (Multi-Processing Station) — upper right ===== -->
                <g class="station" id="station-ms" data-station="MS">
                    <rect x="540" y="30" width="200" height="180" rx="10" class="station-rect" data-color="#007AFF"/>
                    <!-- Conveyor -->
                    <rect x="558" y="88" width="42" height="10" rx="3" fill="rgba(0,122,255,0.08)" stroke="#007AFF" stroke-width="0.6" opacity="0.4"/>
                    <line x1="563" y1="93" x2="595" y2="93" stroke="#007AFF" stroke-width="0.5" opacity="0.2" stroke-dasharray="3,2"/>
                    <!-- Turntable -->
                    <circle cx="630" cy="93" r="16" fill="rgba(0,122,255,0.04)" stroke="#007AFF" stroke-width="0.8" opacity="0.35"/>
                    <circle cx="630" cy="93" r="3" fill="#007AFF" fill-opacity="0.3"/>
                    <text x="630" y="116" text-anchor="middle" class="comp-label">Turntable</text>
                    <!-- Oven -->
                    <rect x="670" y="128" width="42" height="30" rx="4" fill="rgba(0,122,255,0.06)" stroke="#007AFF" stroke-width="0.8" opacity="0.35"/>
                    <rect id="oven-glow" x="676" y="133" width="30" height="20" rx="2" fill="#FF9F0A" fill-opacity="0"/>
                    <text x="691" y="124" text-anchor="middle" class="comp-label">Oven</text>
                    <!-- Saw -->
                    <g transform="translate(596, 142)">
                        <rect width="30" height="22" rx="3" fill="rgba(0,122,255,0.04)" stroke="#007AFF" stroke-width="0.6" opacity="0.3"/>
                        <g id="saw-blade" style="transform-origin: 15px 11px;">
                            <circle cx="15" cy="11" r="7" fill="none" stroke="#007AFF" stroke-width="1" opacity="0.35"/>
                            <line x1="15" y1="4" x2="15" y2="18" stroke="#007AFF" stroke-width="0.4" opacity="0.2"/>
                            <line x1="8" y1="11" x2="22" y2="11" stroke="#007AFF" stroke-width="0.4" opacity="0.2"/>
                        </g>
                    </g>
                    <text x="611" y="172" text-anchor="middle" class="comp-label">Saw</text>
                    <!-- Label -->
                    <text x="640" y="54" text-anchor="middle" class="station-name" fill="#007AFF">MS</text>
                    <text x="640" y="66" text-anchor="middle" class="station-sub">Multi-Processing</text>
                    <!-- Status dot -->
                    <circle id="dot-ms" cx="554" cy="45" r="4" class="status-indicator"/>
                </g>

                <!-- ===== PM (Punching Machine) — far right ===== -->
                <g class="station" id="station-pm" data-station="PM">
                    <rect x="780" y="50" width="170" height="160" rx="10" class="station-rect" data-color="#FF453A"/>
                    <!-- Conveyor -->
                    <rect x="800" y="140" width="70" height="10" rx="3" fill="rgba(255,69,58,0.08)" stroke="#FF453A" stroke-width="0.6" opacity="0.4"/>
                    <line x1="806" y1="145" x2="864" y2="145" stroke="#FF453A" stroke-width="0.5" opacity="0.2" stroke-dasharray="3,2"/>
                    <!-- Punch tool -->
                    <rect x="848" y="98" width="18" height="28" rx="2" fill="rgba(255,69,58,0.06)" stroke="#FF453A" stroke-width="0.8" opacity="0.35"/>
                    <rect id="punch-tip" x="852" y="115" width="10" height="9" rx="1" fill="#FF453A" fill-opacity="0.3"/>
                    <text x="857" y="93" text-anchor="middle" class="comp-label">Punch</text>
                    <!-- Label -->
                    <text x="865" y="72" text-anchor="middle" class="station-name" fill="#FF453A">PM</text>
                    <text x="865" y="84" text-anchor="middle" class="station-sub">Punching Machine</text>
                    <!-- Status dot -->
                    <circle id="dot-pm" cx="794" cy="64" r="4" class="status-indicator"/>
                </g>

                <!-- ===== SL (Sorting Line) — lower right ===== -->
                <g class="station" id="station-sl" data-station="SL">
                    <rect x="540" y="310" width="200" height="165" rx="10" class="station-rect" data-color="#FF9F0A"/>
                    <!-- Conveyor -->
                    <rect x="558" y="380" width="65" height="10" rx="3" fill="rgba(255,159,10,0.08)" stroke="#FF9F0A" stroke-width="0.6" opacity="0.4"/>
                    <line x1="563" y1="385" x2="618" y2="385" stroke="#FF9F0A" stroke-width="0.5" opacity="0.2" stroke-dasharray="3,2"/>
                    <!-- Color sensor -->
                    <rect id="color-sensor" x="610" y="378" width="10" height="6" rx="1.5" fill="#FF9F0A" fill-opacity="0.3" stroke="#FF9F0A" stroke-width="0.6" opacity="0.5"/>
                    <line x1="615" y1="384" x2="615" y2="394" stroke="#FF9F0A" stroke-width="0.4" opacity="0.15" stroke-dasharray="1.5,1.5"/>
                    <text x="615" y="374" text-anchor="middle" class="comp-label">Sensor</text>
                    <!-- Sorting bins -->
                    <g transform="translate(648, 365)">
                        <line x1="-10" y1="20" x2="5" y2="4" stroke="#FF9F0A" stroke-width="0.5" opacity="0.15"/>
                        <line x1="-10" y1="20" x2="5" y2="22" stroke="#FF9F0A" stroke-width="0.5" opacity="0.15"/>
                        <line x1="-10" y1="20" x2="5" y2="42" stroke="#FF9F0A" stroke-width="0.5" opacity="0.15"/>
                        <rect x="5" y="-2" width="24" height="14" rx="2.5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="0.6"/>
                        <text x="17" y="9" text-anchor="middle" class="bin-label" fill="rgba(255,255,255,0.35)">W</text>
                        <circle id="bin-white" cx="33" cy="5" r="2.5" fill="transparent"/>
                        <rect x="5" y="16" width="24" height="14" rx="2.5" fill="rgba(255,69,58,0.06)" stroke="rgba(255,69,58,0.25)" stroke-width="0.6"/>
                        <text x="17" y="27" text-anchor="middle" class="bin-label" fill="rgba(255,69,58,0.45)">R</text>
                        <circle id="bin-red" cx="33" cy="23" r="2.5" fill="transparent"/>
                        <rect x="5" y="36" width="24" height="14" rx="2.5" fill="rgba(0,122,255,0.06)" stroke="rgba(0,122,255,0.25)" stroke-width="0.6"/>
                        <text x="17" y="47" text-anchor="middle" class="bin-label" fill="rgba(0,122,255,0.45)">B</text>
                        <circle id="bin-blue" cx="33" cy="43" r="2.5" fill="transparent"/>
                    </g>
                    <!-- Label -->
                    <text x="640" y="334" text-anchor="middle" class="station-name" fill="#FF9F0A">SL</text>
                    <text x="640" y="346" text-anchor="middle" class="station-sub">Sorting Line</text>
                    <!-- Status dot -->
                    <circle id="dot-sl" cx="554" cy="325" r="4" class="status-indicator"/>
                </g>

                <!-- Trail group (behind workpieces) -->
                <g id="trail-group"></g>
            </svg>
        </div>

        <!-- Station Cards Row -->
        <div class="station-cards" id="station-cards">
            <div class="station-card glass" id="card-hbw" data-station="HBW">
                <div class="card-top">
                    <div class="card-name-row">
                        <span class="card-dot" style="--dot-color: #AF52DE"></span>
                        <span class="card-name">HBW</span>
                    </div>
                    <span class="card-status idle" id="card-status-hbw">Idle</span>
                </div>
                <div class="card-action mono" id="card-action-hbw">--</div>
                <div class="card-meta">
                    <span class="card-cycle mono" id="card-cycle-hbw">--</span>
                </div>
            </div>

            <div class="station-card glass" id="card-crane" data-station="Crane">
                <div class="card-top">
                    <div class="card-name-row">
                        <span class="card-dot" style="--dot-color: #30D158"></span>
                        <span class="card-name">Crane</span>
                    </div>
                    <span class="card-status idle" id="card-status-crane">Idle</span>
                </div>
                <div class="card-action mono" id="card-action-crane">--</div>
                <div class="card-meta">
                    <span class="card-cycle mono" id="card-cycle-crane">--</span>
                </div>
            </div>

            <div class="station-card glass" id="card-ms" data-station="MS">
                <div class="card-top">
                    <div class="card-name-row">
                        <span class="card-dot" style="--dot-color: #007AFF"></span>
                        <span class="card-name">MS</span>
                    </div>
                    <span class="card-status idle" id="card-status-ms">Idle</span>
                </div>
                <div class="card-action mono" id="card-action-ms">--</div>
                <div class="card-meta">
                    <span class="card-cycle mono" id="card-cycle-ms">--</span>
                </div>
            </div>

            <div class="station-card glass" id="card-pm" data-station="PM">
                <div class="card-top">
                    <div class="card-name-row">
                        <span class="card-dot" style="--dot-color: #FF453A"></span>
                        <span class="card-name">PM</span>
                    </div>
                    <span class="card-status idle" id="card-status-pm">Idle</span>
                </div>
                <div class="card-action mono" id="card-action-pm">--</div>
                <div class="card-meta">
                    <span class="card-cycle mono" id="card-cycle-pm">--</span>
                </div>
            </div>

            <div class="station-card glass" id="card-sl" data-station="SL">
                <div class="card-top">
                    <div class="card-name-row">
                        <span class="card-dot" style="--dot-color: #FF9F0A"></span>
                        <span class="card-name">SL</span>
                    </div>
                    <span class="card-status idle" id="card-status-sl">Idle</span>
                </div>
                <div class="card-action mono" id="card-action-sl">--</div>
                <div class="card-meta">
                    <span class="card-cycle mono" id="card-cycle-sl">--</span>
                </div>
            </div>
        </div>
    </div>

    <script src="/dashboards/twin-v2/app.js"></script>
</body>
</html>
